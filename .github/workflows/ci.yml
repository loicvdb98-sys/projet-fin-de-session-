# Intégration continue : à chaque push sur main (et sur chaque pull request), les tests du
# backend et du frontend sont lancés, puis le build de production du frontend. Le résultat
# s'affiche dans l'onglet « Actions » de GitHub et sur le badge du README.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Dépendances
        run: pip install -r requirements-dev.txt
      # Les tests tournent sur une base SQLite en mémoire (tests/conftest.py) : pas de SQL Server.
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (Vitest et build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances
        run: npm ci
      - name: Tests
        run: npx ng test --watch=false
      - name: Build de production
        run: npx ng build
